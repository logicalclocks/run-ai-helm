# yaml-language-server: $schema=values.schema.json

# -- (object) TLS for the control-plane ingress. The upstream chart reads the Secret
# runai-backend-tls (Ingress, PostgreSQL TLS); set exactly one of certificate+key or
# certManager.enabled, or create runai-backend-tls yourself before installing.
tls:
  # -- (string) PEM certificate chain for global.domain. Rendered into runai-backend-tls.
  certificate: ""
  # -- (string) PEM private key matching tls.certificate.
  key: ""
  certManager:
    # -- (bool) Issue runai-backend-tls with a cert-manager Certificate for global.domain.
    enabled: false
    # @schema
    # additionalProperties: true
    # @schema
    # -- (object) cert-manager issuer that signs the certificate.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io

# @schema
# additionalProperties: true
# patternProperties:
#   ".*":
#     type: [object, array, string, number, integer, boolean, "null"]
# @schema
# -- (object) Values for the upstream Run:ai control-plane chart
# (https://helm.ngc.nvidia.com/nvidia/runai-oss). Its global.* keys are set at the umbrella's
# global level.
control-plane:
  # The upstream chart only wires the database into Keycloak's schema-init container; the main
  # container needs the same connection. Mirrors run-ai's .local-dev/values-cp.yaml.
  keycloakx:
    database:
      hostname: runai-backend-postgresql
      port: 5432
      database: backend
      username: user
      existingSecret: runai-backend-gen-postgresql
      existingSecretKey: password
    extraEnv: |
      - name: KEYCLOAK_ADMIN
        value: admin
      - name: KEYCLOAK_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: runai-backend-gen-keycloakx
            key: KEYCLOAK_ADMIN_PASSWORD

# @schema
# additionalProperties: true
# @schema
# @ignored
runailib: {}
