{{- include "runailib.registrySecret" (dict "context" . "name" "runai-reg-creds") }}
---
{{- include "runailib.customCASecret" . }}
{{- if .Values.tls.certificate }}
---
apiVersion: v1
kind: Secret
metadata:
  name: runai-backend-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runailib.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.certificate | b64enc }}
  tls.key: {{ .Values.tls.key | b64enc }}
{{- end }}
{{- if .Values.tls.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runai-backend-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runailib.labels" . | nindent 4 }}
spec:
  secretName: runai-backend-tls
  dnsNames:
    - {{ .Values.global.domain | quote }}
    - {{ printf "*.%s" .Values.global.domain | quote }}
  issuerRef:
    {{- toYaml .Values.tls.certManager.issuerRef | nindent 4 }}
{{- end }}
